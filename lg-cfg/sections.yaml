src:
  extensions: [".ts", ".json", ".html", ".css", ".js"]
  filters:
    mode: allow
    allow:
      - "/src/"
      - "/media/"
      - "/package.json"
    children:
      media:
        mode: allow
        when:
          # UI Core - base styles and utilities
          - condition: >
              TAGSET:vscode-extension:ui-core OR
              TAGSET:vscode-extension:control OR
              TAGSET:vscode-extension:stats OR
              TAGSET:vscode-extension:diag
            allow:
              - "base.css"
              - "common.js"
              - "/ui/core/"
              - "/ui/utils/"
          # UI Components library
          - condition: "TAGSET:vscode-extension:ui-components"
            allow: ["/ui/components/"]
          # Control Panel view
          - condition: "TAGSET:vscode-extension:control"
            allow: ["control*"]
          # Stats view
          - condition: "TAGSET:vscode-extension:stats"
            allow:
              - "stats*"
              - "/ui/components/grouped-table/grouped-table.js"
              - "/ui/components/textarea/textarea.js"
          # Diagnostics view
          - condition: "TAGSET:vscode-extension:diag"
            allow:
              - "doctor*"
              - "/ui/components/textarea/textarea.js"

      src:
        mode: allow
        when:
          # ==================== INFRASTRUCTURE ====================

          # Core - bootstrap, extension entry, logging
          - condition: "TAGSET:vscode-extension:core"
            allow:
              - "/extension.ts"
              - "/constants.ts"
              - "/bootstrap/"
              - "/logging/"
              - "/webview/webviewKit.ts"

          # State Engine - universal coordination engine
          - condition: "TAGSET:vscode-extension:state-engine"
            allow:
              - "/state-engine/"

          # State LG - LG-specific state management
          - condition: "TAGSET:vscode-extension:state-lg"
            allow:
              - "/state-lg/types.ts"
              - "/state-lg/store.ts"
              - "/state-lg/coordinator.ts"
              - "/state-lg/rule.ts"
              - "/state-lg/index.ts"
              - "/state-lg/domains/index.ts"
              - "/state-lg/domains/lifecycle.ts"
              - "/state-lg/watchers/"
              - "/viewmodel/"

          # CLI Integration
          - condition: "TAGSET:vscode-extension:cli"
            allow: ["/cli/"]

          # UI Components build
          - condition: "TAGSET:vscode-extension:ui-components"
            allow: ["/build-ui.ts"]

          # ==================== BUSINESS DOMAINS ====================

          # Context Domain (state only)
          - condition: "TAGSET:vscode-extension:context"
            allow:
              - "/state-lg/domains/context.ts"

          # Section Domain (state + included tree)
          - condition: "TAGSET:vscode-extension:section"
            allow:
              - "/state-lg/domains/section.ts"
              - "/views/IncludedTree.ts"
              - "/models/sections_list.ts"

          # Adaptive Domain - modes, tags, branches
          - condition: "TAGSET:vscode-extension:adaptive"
            allow:
              - "/state-lg/domains/adaptive.ts"
              - "/models/mode_sets_list.ts"
              - "/models/tag_sets_list.ts"
              - "/services/GitService.ts"

          # Stats Domain - statistics, tokenization
          - condition: "TAGSET:vscode-extension:stats"
            allow:
              - "/state-lg/domains/tokenization.ts"
              - "/services/StatsService.ts"
              - "/actions/StatsActions.ts"
              - "/views/StatsWebview.ts"
              - "/models/report.ts"

          # Generate Domain - content generation
          - condition: "TAGSET:vscode-extension:generate"
            allow:
              - "/services/GenerationService.ts"
              - "/actions/GenerationActions.ts"
              - "/views/VirtualDocProvider.ts"
              - "/views/virtualBus.ts"

          # Provider Domain - AI providers
          - condition: "TAGSET:vscode-extension:send-to-ai"
            allow:
              - "/state-lg/domains/provider.ts"
              - "/services/ai/"
              - "/models/ShellType.ts"
              - "/actions/AiActions.ts"

          # Diagnostics Domain
          - condition: "TAGSET:vscode-extension:diag"
            allow:
              - "/services/DoctorService.ts"
              - "/views/DoctorWebview.ts"
              - "/models/diag_report.ts"

          # Starter Domain
          - condition: "TAGSET:vscode-extension:starter"
            allow: ["/starter/StarterConfig.ts"]

          # ==================== VIEWS ====================

          # Control Panel View
          - condition: "TAGSET:vscode-extension:control"
            allow:
              - "/views/ControlPanelView.ts"
              - "/viewmodel/"
              - "/actions/ToolbarActions.ts"

          # ==================== PROVIDER-SPECIFIC ====================

          # Claude CLI provider with settings
          - condition: "TAGSET:vscode-extension:send-to-ai AND TAGSET:ai-providers:claude-code-cli"
            allow:
              - "/models/ClaudeIntegrationMethod.ts"
              - "/models/ClaudeModel.ts"

          # Codex CLI provider with settings
          - condition: "TAGSET:vscode-extension:send-to-ai AND TAGSET:ai-providers:codex-cli"
            allow:
              - "/models/CodexReasoningEffort.ts"

        children:
          services:
            mode: block
            children:
              ai:
                mode: block
                children:
                  base:
                    mode: allow
                    allow:
                      - "/BaseAiProvider.ts"
                      - "/index.ts"
                    when:
                      - condition: "TAGSET:ai-providers:github-copilot"
                        allow: ["/BaseExtensionProvider.ts"]
                      - condition: "TAGSET:ai-providers:claude-code-cli OR TAGSET:ai-providers:codex-cli"
                        allow: ["/BaseCliProvider.ts"]
                      - condition: "TAGSET:ai-providers:cursor"
                        allow: ["/BaseForkProvider.ts"]
                  providers:
                    mode: allow
                    when:
                      - condition: "TAGSET:ai-providers:clipboard"
                        allow: ["/clipboard/"]
                      - condition: "TAGSET:ai-providers:github-copilot"
                        allow: ["/copilot/"]
                      - condition: "TAGSET:ai-providers:cursor"
                        allow: ["/cursor/"]
                      - condition: "TAGSET:ai-providers:claude-code-cli"
                        allow: ["/claude-cli/"]
                      - condition: "TAGSET:ai-providers:codex-cli"
                        allow: ["/codex-cli/"]

review:
  extensions: [".ts", ".json", ".html", ".css", ".js"]
  filters:
    mode: allow
    allow:
      - "/src/"
      - "/media/"
      - "/package.json"
